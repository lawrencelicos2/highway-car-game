<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Highway & Checkered Sandbox Physics Studio</title>
    <style>
        :root {
            --bg: #1e293b;
            --panel: rgba(255, 255, 255, 0.92);
            --accent: #2563eb;
            --text: #1e293b;
            --border: #cbd5e1;
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text);
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #ui-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 350px;
            background: var(--panel);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
            z-index: 10;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            max-height: 92vh;
            overflow-y: auto;
        }
        h2 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #2563eb;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }
        .control-group {
            margin-bottom: 8px;
        }
        label {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            margin-bottom: 2px;
            color: #64748b;
        }
        label span {
            color: #0f172a;
            font-weight: bold;
        }
        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
            cursor: pointer;
        }
        select {
            width: 100%;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #f8fafc;
            color: #0f172a;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
        }
        .json-section {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }
        textarea {
            width: 100%;
            height: 60px;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: monospace;
            font-size: 10px;
            padding: 6px;
            box-sizing: border-box;
            resize: none;
            color: #334155;
        }
        .btn-row {
            display: flex;
            gap: 6px;
            margin-top: 6px;
        }
        button, .upload-btn {
            display: block;
            width: 100%;
            background: #2563eb;
            color: #ffffff;
            border: 1px solid #1d4ed8;
            padding: 8px;
            border-radius: 6px;
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            box-sizing: border-box;
            transition: background 0.2s;
        }
        button:hover, .upload-btn:hover {
            background: #1d4ed8;
        }
        input[type="file"] {
            display: none;
        }
        #hud {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 12px 18px;
            border-radius: 10px;
            z-index: 10;
            font-family: monospace;
            pointer-events: none;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        #hud div {
            font-size: 13px;
            margin: 2px 0;
            color: #2563eb;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-panel">
        <h2>ENVIRONMENT MODE</h2>
        <div class="control-group">
            <label>Map Layout:</label>
            <select id="mapMode">
                <option value="checkerboard">Checkerboard Sandbox</option>
                <option value="highway">Endless Looping Highway (No Teleport)</option>
            </select>
        </div>

        <h2>PHYSICS STUDIO</h2>
        <div class="control-group">
            <label>Weight (Mass): <span id="val-weight">1000</span> kg</label>
            <input type="range" id="weight" min="50" max="3500" step="50" value="1000">
        </div>
        <div class="control-group">
            <label>Forward Accel: <span id="val-accel">0.02</span></label>
            <input type="range" id="accel" min="0.001" max="500.1" step="0.005" value="0.02">
        </div>
        <div class="control-group">
            <label>Braking Decel: <span id="val-brake">0.015</span></label>
            <input type="range" id="brake" min="0.001" max="500.05" step="0.005" value="0.015">
        </div>
        <div class="control-group">
            <label>Top Speed: <span id="val-topSpeed">1.5</span></label>
            <input type="range" id="topSpeed" min="0.1" max="503.0" step="0.1" value="1.5">
        </div>
        <div class="control-group">
            <label>Turn Speed Factor: <span id="val-turnSpeedFactor">0.004</span></label>
            <input type="range" id="turnSpeedFactor" min="0.0001" max="500.02" step="0.0005" value="0.004">
        </div>
        <div class="control-group">
            <label>Turn Speed Limit (Cap): <span id="val-turnSpeedLimit">0.05</span></label>
            <input type="range" id="turnSpeedLimit" min="0.001" max="501.0" step="0.005" value="0.05">
        </div>
        <div class="control-group">
            <label>Steering Smoothness (Wheel Lag): <span id="val-steerSmoothing">0.15</span></label>
            <input type="range" id="steerSmoothing" min="0.01" max="1.0" step="0.01" value="0.15">
        </div>

        <h2>VEHICLE VISUALS & SCALE</h2>
        <div class="control-group">
            <label>Car Size (Scale): <span id="val-carScale">1.0</span>x</label>
            <input type="range" id="carScale" min="0.1" max="503.0" step="0.1" value="1.0">
        </div>
        <div class="control-group">
            <label>Shininess (Metal/Rough): <span id="val-shininess">1.0</span></label>
            <input type="range" id="shininess" min="0.0" max="501.0" step="0.05" value="1.0">
        </div>

        <h2>CAMERA STUDIO</h2>
        <div class="control-group">
            <label>Field of View (FOV): <span id="val-fov">65</span>°</label>
            <input type="range" id="fov" min="10" max="620" step="1" value="65">
        </div>
        <div class="control-group">
            <label>Base Camera Zoom: <span id="val-zoom">9</span>m</label>
            <input type="range" id="zoom" min="1" max="530" step="1" value="9">
        </div>
        <div class="control-group">
            <label>Speed Zoom Factor: <span id="val-speedZoomFactor">2.0</span></label>
            <input type="range" id="speedZoomFactor" min="0.0" max="510.0" step="0.1" value="2.0">
        </div>
        <div class="control-group">
            <label>Camera Smoothing: <span id="val-smoothing">0.12</span></label>
            <input type="range" id="smoothing" min="0.001" max="500.5" step="0.01" value="0.12">
        </div>

        <h2>MODEL ORIENTATION FIXER</h2>
        <div class="control-group">
            <label>Model Rotation X: <span id="val-rotX">0</span>°</label>
            <input type="range" id="rotX" min="-680" max="680" step="1" value="0">
        </div>
        <div class="control-group">
            <label>Model Rotation Y: <span id="val-rotY">180</span>°</label>
            <input type="range" id="rotY" min="-680" max="680" step="1" value="180">
        </div>
        <div class="control-group">
            <label>Model Rotation Z: <span id="val-rotZ">0</span>°</label>
            <input type="range" id="rotZ" min="-680" max="680" step="1" value="0">
        </div>

        <div class="json-section">
            <label>JSON Config (Copy / Paste):</label>
            <textarea id="jsonBox"></textarea>
            <div class="btn-row">
                <button id="copyJson">Copy JSON</button>
                <button id="loadJson">Load JSON</button>
            </div>
        </div>

        <div class="upload-section" style="margin-top: 10px;">
            <label class="upload-btn" for="modelUpload">Upload Car (.glb / .gltf / .fbx)</label>
            <input type="file" id="modelUpload" accept=".glb,.gltf,.fbx">
        </div>
    </div>

    <div id="hud">
        <div id="hud-speed">SPEED: 0 MPH</div>
        <div id="hud-controls">[W/S] Drive | [A/D] Steer</div>
    </div>

    <!-- Three.js & Loaders CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.7.4/umd/index.min.js"></script>

    <script>
        // Default Configuration State
        const defaultPhysics = {
            mapMode: "checkerboard",
            weight: 1000,
            accel: 0.02,
            brake: 0.015,
            topSpeed: 1.5,
            turnSpeedFactor: 0.004,
            turnSpeedLimit: 0.05,
            steerSmoothing: 0.15,
            carScale: 1.0,
            shininess: 1.0,
            fov: 65,
            zoom: 9,
            speedZoomFactor: 2.0,
            smoothing: 0.12,
            rotX: 0,
            rotY: 180,
            rotZ: 0
        };

        let physics = { ...defaultPhysics };

        const bindings = [
            { id: 'weight', key: 'weight', unit: ' kg' },
            { id: 'accel', key: 'accel', unit: '' },
            { id: 'brake', key: 'brake', unit: '' },
            { id: 'topSpeed', key: 'topSpeed', unit: '' },
            { id: 'turnSpeedFactor', key: 'turnSpeedFactor', unit: '' },
            { id: 'turnSpeedLimit', key: 'turnSpeedLimit', unit: '' },
            { id: 'steerSmoothing', key: 'steerSmoothing', unit: '' },
            { id: 'carScale', key: 'carScale', unit: 'x' },
            { id: 'shininess', key: 'shininess', unit: '' },
            { id: 'fov', key: 'fov', unit: '°' },
            { id: 'zoom', key: 'zoom', unit: 'm' },
            { id: 'speedZoomFactor', key: 'speedZoomFactor', unit: '' },
            { id: 'smoothing', key: 'smoothing', unit: '' },
            { id: 'rotX', key: 'rotX', unit: '°' },
            { id: 'rotY', key: 'rotY', unit: '°' },
            { id: 'rotZ', key: 'rotZ', unit: '°' }
        ];

        function updateUIFromState() {
            bindings.forEach(b => {
                const input = document.getElementById(b.id);
                const span = document.getElementById(`val-${b.id}`);
                if (input && span) {
                    input.value = physics[b.key];
                    span.textContent = physics[b.key] + b.unit;
                }
            });
            document.getElementById('mapMode').value = physics.mapMode;
            camera.fov = physics.fov;
            camera.updateProjectionMatrix();
            updateEnvironmentMode();
            updateCarTransform();
            updateCarMaterials();
            updateJsonBox();
        }

        bindings.forEach(b => {
            const input = document.getElementById(b.id);
            const span = document.getElementById(`val-${b.id}`);
            input.addEventListener('input', (e) => {
                physics[b.key] = parseFloat(e.target.value);
                span.textContent = physics[b.key] + b.unit;
                if(b.key === 'fov') {
                    camera.fov = physics.fov;
                    camera.updateProjectionMatrix();
                }
                if(b.key.startsWith('rot') || b.key === 'carScale') {
                    updateCarTransform();
                }
                if(b.key === 'shininess') {
                    updateCarMaterials();
                }
                updateJsonBox();
            });
        });

        document.getElementById('mapMode').addEventListener('change', (e) => {
            physics.mapMode = e.target.value;
            updateEnvironmentMode();
            updateJsonBox();
        });

        function updateCarTransform() {
            carModelGroup.rotation.x = THREE.MathUtils.degToRad(physics.rotX);
            carModelGroup.rotation.y = THREE.MathUtils.degToRad(physics.rotY);
            carModelGroup.rotation.z = THREE.MathUtils.degToRad(physics.rotZ);
            carModelGroup.scale.set(physics.carScale, physics.carScale, physics.carScale);

            // Apply scale to AI models as well
            aiCars.forEach(ai => {
                ai.group.scale.set(physics.carScale, physics.carScale, physics.carScale);
            });
        }

        const mirrorMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x2563eb, 
            metalness: 1.0, 
            roughness: 0.0,
            envMapIntensity: 3.0
        });
        const roofMirrorMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x0f172a, 
            metalness: 1.0, 
            roughness: 0.0 
        });

        function updateCarMaterials() {
            const r = Math.max(0.0, 1.0 - (physics.shininess / Math.max(1, physics.shininess))); 
            mirrorMaterial.roughness = r;
            roofMirrorMaterial.roughness = r;
        }

        function updateJsonBox() {
            document.getElementById('jsonBox').value = JSON.stringify(physics, null, 2);
        }

        document.getElementById('copyJson').addEventListener('click', () => {
            const box = document.getElementById('jsonBox');
            box.select();
            navigator.clipboard.writeText(box.value);
            alert('Settings JSON copied to clipboard!');
        });

        document.getElementById('loadJson').addEventListener('click', () => {
            try {
                const parsed = JSON.parse(document.getElementById('jsonBox').value);
                physics = { ...defaultPhysics };
                Object.keys(parsed).forEach(k => {
                    if (physics.hasOwnProperty(k)) {
                        physics[k] = parsed[k];
                    }
                });
                updateUIFromState();
                alert('Settings loaded successfully (missing values defaulted)!');
            } catch (err) {
                alert('Invalid JSON formatting in text box.');
            }
        });

        // Scene Setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1e293b);
        scene.fog = new THREE.FogExp2(0x1e293b, 0.003);

        const camera = new THREE.PerspectiveCamera(physics.fov, window.innerWidth / window.innerHeight, 0.1, 10000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.4;
        container.appendChild(renderer.domElement);

        const cubeRenderTarget = new THREE.WebGLCubeRenderTarget(256, { generateMipmaps: true, minFilter: THREE.LinearMipmapLinearFilter, magFilter: THREE.LinearFilter });
        const cubeCamera = new THREE.CubeCamera(0.1, 10000, cubeRenderTarget);
        scene.add(cubeCamera);

        mirrorMaterial.envMap = cubeRenderTarget.texture;
        roofMirrorMaterial.envMap = cubeRenderTarget.texture;

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
        dirLight.position.set(40, 100, 50);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        const d = 150;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        scene.add(dirLight);

        // Environment Groups
        const checkerGroup = new THREE.Group();
        const highwayGroup = new THREE.Group();
        scene.add(checkerGroup);
        scene.add(highwayGroup);
        highwayGroup.visible = false;

        // 1. Checkerboard Setup
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');
        const squares = 8;
        const size = canvas.width / squares;
        for (let x = 0; x < squares; x++) {
            for (let y = 0; y < squares; y++) {
                ctx.fillStyle = (x + y) % 2 === 0 ? '#ffffff' : '#000000';
                ctx.fillRect(x * size, y * size, size, size);
            }
        }
        const checkerTexture = new THREE.CanvasTexture(canvas);
        checkerTexture.wrapS = THREE.RepeatWrapping;
        checkerTexture.wrapT = THREE.RepeatWrapping;
        checkerTexture.repeat.set(80, 80);

        const planeGeo = new THREE.PlaneGeometry(8000, 8000);
        const planeMat = new THREE.MeshStandardMaterial({ map: checkerTexture, roughness: 0.4 });
        const checkerPlane = new THREE.Mesh(planeGeo, planeMat);
        checkerPlane.rotation.x = -Math.PI / 2;
        checkerPlane.receiveShadow = true;
        checkerGroup.add(checkerPlane);

        // 2. Endless Looping Highway Setup (Modular Sections for Infinite Smoothness without Teleporting)
        const roadWidth = 24;
        const highwayLength = 10000; // Extremely long continuous road
        const roadGeo = new THREE.PlaneGeometry(roadWidth, highwayLength);
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x111318, roughness: 0.5 });
        const highwayRoad = new THREE.Mesh(roadGeo, roadMat);
        highwayRoad.rotation.x = -Math.PI / 2;
        highwayRoad.receiveShadow = true;
        highwayGroup.add(highwayRoad);

        // Center dashed lines
        const lineGeo = new THREE.PlaneGeometry(0.4, highwayLength);
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xf59e0b });
        const highwayLine = new THREE.Mesh(lineGeo, lineMat);
        highwayLine.rotation.x = -Math.PI / 2;
        highwayLine.position.y = 0.02;
        highwayGroup.add(highwayLine);

        // Streetlights along highway
        const poleGeo = new THREE.CylinderGeometry(0.3, 0.3, 10, 8);
        const armGeo = new THREE.BoxGeometry(3, 0.3, 0.3);
        const lampMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.8, roughness: 0.2 });
        const spacing = 50;

        for (let i = -100; i <= 100; i++) {
            [-1, 1].forEach(side => {
                const xPos = side * (roadWidth / 2 + 1.5);
                const pole = new THREE.Mesh(poleGeo, lampMat);
                pole.position.set(xPos, 5, i * spacing);
                pole.castShadow = true;
                highwayGroup.add(pole);

                const arm = new THREE.Mesh(armGeo, lampMat);
                arm.position.set(xPos - (side * 1.5), 9.9, i * spacing);
                highwayGroup.add(arm);
            });
        }

        function updateEnvironmentMode() {
            if (physics.mapMode === 'checkerboard') {
                checkerGroup.visible = true;
                highwayGroup.visible = false;
            } else {
                checkerGroup.visible = false;
                highwayGroup.visible = true;
            }
        }

        // Vehicle Base & Master Model Setup
        const carContainer = new THREE.Group();
        carContainer.position.set(0, 0, 0);
        scene.add(carContainer);

        const carModelGroup = new THREE.Group();
        carContainer.add(carModelGroup);

        const bodyGeo = new THREE.BoxGeometry(2, 0.8, 4.2);
        const carBody = new THREE.Mesh(bodyGeo, mirrorMaterial);
        carBody.position.y = 0.4;
        carBody.castShadow = true;
        carModelGroup.add(carBody);

        const roofGeo = new THREE.BoxGeometry(1.6, 0.6, 2.2);
        const carRoof = new THREE.Mesh(roofGeo, roofMirrorMaterial);
        carRoof.position.set(0, 1.1, -0.2);
        carRoof.castShadow = true;
        carModelGroup.add(carRoof);

        // AI Traffic Cars Setup (Using exact duplicate of player car model)
        const aiCars = [];
        const numAiCars = 12;
        for (let i = 0; i < numAiCars; i++) {
            const aiGroup = new THREE.Group();
            
            // Duplicate model structure
            const aiBody = new THREE.Mesh(bodyGeo, mirrorMaterial);
            aiBody.position.y = 0.4;
            aiBody.castShadow = true;
            aiGroup.add(aiBody);

            const aiRoof = new THREE.Mesh(roofGeo, roofMirrorMaterial);
            aiRoof.position.set(0, 1.1, -0.2);
            aiRoof.castShadow = true;
            aiGroup.add(aiRoof);

            scene.add(aiGroup);

            aiCars.push({
                group: aiGroup,
                x: (Math.random() - 0.5) * (roadWidth - 4),
                z: -i * 150 - Math.random() * 50,
                speed: 0.6 + Math.random() * 0.4
            });
        }

        updateUIFromState();

        // Model Uploader
        const fileInput = document.getElementById('modelUpload');
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            const fileName = file.name.toLowerCase();

            reader.readAsArrayBuffer(file);
            reader.onload = function (event) {
                const contents = event.target.result;
                if (fileName.endsWith('.glb') || fileName.endsWith('.gltf')) {
                    const loader = new THREE.GLTFLoader();
                    loader.parse(contents, '', (gltf) => {
                        applyCustomModelToAll(gltf.scene);
                    }, (err) => { console.error(err); alert('Failed to parse GLB/GLTF.'); });
                } 
                else if (fileName.endsWith('.fbx')) {
                    try {
                        const loader = new THREE.FBXLoader();
                        const decodedData = loader.parse(contents, '');
                        applyCustomModelToAll(decodedData);
                    } catch (err) {
                        console.error(err);
                        alert('Failed to parse FBX.');
                    }
                }
            };
        });

        function applyCustomModelToAll(sourceScene) {
            carModelGroup.clear();
            const loadedMesh = sourceScene.clone();
            loadedMesh.traverse(child => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                    if (child.material) {
                        child.material.metalness = 1.0;
                        child.material.roughness = 0.0;
                        child.material.envMap = cubeRenderTarget.texture;
                        child.material.envMapIntensity = 3.0;
                        child.material.needsUpdate = true;
                    }
                }
            });
            carModelGroup.add(loadedMesh);

            // Apply to all AI traffic cars too
            aiCars.forEach(ai => {
                ai.group.clear();
                const aiMesh = sourceScene.clone();
                aiMesh.traverse(child => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                        if (child.material) {
                            child.material.metalness = 1.0;
                            child.material.roughness = 0.0;
                            child.material.envMap = cubeRenderTarget.texture;
                            child.material.envMapIntensity = 3.0;
                            child.material.needsUpdate = true;
                        }
                    }
                });
                ai.group.add(aiMesh);
            });

            updateCarTransform();
        }

        // Controls State
        const keys = { w: false, s: false, a: false, d: false };
        window.addEventListener('keydown', (e) => {
            if (['w','W'].includes(e.key)) keys.w = true;
            if (['s','S'].includes(e.key)) keys.s = true;
            if (['a','A'].includes(e.key)) keys.a = true;
            if (['d','D'].includes(e.key)) keys.d = true;
        });
        window.addEventListener('keyup', (e) => {
            if (['w','W'].includes(e.key)) keys.w = false;
            if (['s','S'].includes(e.key)) keys.s = false;
            if (['a','A'].includes(e.key)) keys.a = false;
            if (['d','D'].includes(e.key)) keys.d = false;
        });

        let currentSpeed = 0;
        let carAngle = 0;
        let currentSteerAngle = 0; // Steering wheel smoothing / easing state

        // Physics & Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            const effectiveAccel = physics.accel * (1000 / physics.weight);
            const effectiveBrake = physics.brake * (1000 / physics.weight);

            if (keys.w) currentSpeed = Math.min(currentSpeed + effectiveAccel, physics.topSpeed);
            else if (keys.s) currentSpeed = Math.max(currentSpeed - effectiveBrake, -physics.topSpeed / 2);
            else {
                if (currentSpeed > 0) currentSpeed = Math.max(0, currentSpeed - effectiveBrake);
                if (currentSpeed < 0) currentSpeed = Math.min(0, currentSpeed + effectiveBrake);
            }

            // Target steering input calculation based on keys
            let targetSteerInput = 0;
            if (keys.a) targetSteerInput = 1;
            if (keys.d) targetSteerInput = -1;

            // Smoothly ease into steering angle like turning a real steering wheel
            currentSteerAngle += (targetSteerInput - currentSteerAngle) * physics.steerSmoothing;

            // Turn speed = car speed * turn speed factor, capped by limit
            if (Math.abs(currentSpeed) > 0.001 && Math.abs(currentSteerAngle) > 0.01) {
                let dynamicTurnRate = Math.abs(currentSpeed) * physics.turnSpeedFactor;
                dynamicTurnRate = Math.min(dynamicTurnRate, physics.turnSpeedLimit);
                carAngle += currentSteerAngle * dynamicTurnRate * (currentSpeed > 0 ? 1 : -1);
            }

            carContainer.rotation.y = carAngle;

            carContainer.position.x += Math.sin(carAngle) * currentSpeed;
            carContainer.position.z += Math.cos(carAngle) * currentSpeed;

            // Boundary constraints for highway mode
            if (physics.mapMode === 'highway') {
                carContainer.position.x = Math.max(-roadWidth / 2 + 1.5, Math.min(roadWidth / 2 - 1.5, carContainer.position.x));
            }

            // Update AI Traffic Cars
            aiCars.forEach(ai => {
                ai.z -= ai.speed * 0.4;
                // Loop AI cars seamlessly far ahead / behind
                if (ai.z > carContainer.position.z + 200) {
                    ai.z = carContainer.position.z - 1500 - Math.random() * 500;
                    ai.x = (Math.random() - 0.5) * (roadWidth - 4);
                }
                if (ai.z < carContainer.position.z - 2000) {
                    ai.z = carContainer.position.z + 500 + Math.random() * 500;
                    ai.x = (Math.random() - 0.5) * (roadWidth - 4);
                }
                ai.group.position.set(ai.x, 0, ai.z);
                ai.group.rotation.y = 0; // facing straight down highway
            });

            // Camera follow with speed zoom (Zero Teleporting!)
            const currentZoomDistance = physics.zoom + (Math.abs(currentSpeed) * physics.speedZoomFactor);

            const targetCamX = carContainer.position.x - Math.sin(carAngle) * currentZoomDistance;
            const targetCamY = carContainer.position.y + (currentZoomDistance * 0.38);
            const targetCamZ = carContainer.position.z - Math.cos(carAngle) * currentZoomDistance;

            camera.position.x += (targetCamX - camera.position.x) * physics.smoothing;
            camera.position.y += (targetCamY - camera.position.y) * physics.smoothing;
            camera.position.z += (targetCamZ - camera.position.z) * physics.smoothing;

            camera.lookAt(carContainer.position.x, carContainer.position.y + 1, carContainer.position.z);

            // Update realtime reflections
            carModelGroup.visible = false;
            aiCars.forEach(ai => ai.group.visible = false);
            
            cubeCamera.position.copy(carContainer.position);
            cubeCamera.update(renderer, scene);
            
            carModelGroup.visible = true;
            aiCars.forEach(ai => ai.group.visible = true);

            document.getElementById('hud-speed').textContent = `SPEED: ${Math.round(Math.abs(currentSpeed) * 85)} MPH`;

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
