<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Grid Physics Test Studio</title>
    <style>
        :root {
            --bg: #e2e8f0;
            --panel: rgba(255, 255, 255, 0.9);
            --accent: #2563eb;
            --text: #1e293b;
            --border: #cbd5e1;
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text);
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #ui-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 330px;
            background: var(--panel);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            z-index: 10;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-height: 92vh;
            overflow-y: auto;
        }
        h2 {
            margin: 0 0 12px 0;
            font-size: 15px;
            color: #2563eb;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
        }
        .control-group {
            margin-bottom: 10px;
        }
        label {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            margin-bottom: 3px;
            color: #64748b;
        }
        label span {
            color: #0f172a;
            font-weight: bold;
        }
        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
            cursor: pointer;
        }
        .upload-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
        }
        .upload-btn {
            display: block;
            width: 100%;
            background: #2563eb;
            color: #ffffff;
            border: 1px solid #1d4ed8;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            box-sizing: border-box;
            transition: background 0.2s;
        }
        .upload-btn:hover {
            background: #1d4ed8;
        }
        input[type="file"] {
            display: none;
        }
        #hud {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 15px 20px;
            border-radius: 10px;
            z-index: 10;
            font-family: monospace;
            pointer-events: none;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        #hud div {
            font-size: 14px;
            margin: 3px 0;
            color: #2563eb;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-panel">
        <h2>PHYSICS STUDIO</h2>
        <div class="control-group">
            <label>Weight (Mass): <span id="val-weight">1000</span> kg</label>
            <input type="range" id="weight" min="200" max="3000" step="50" value="1000">
        </div>
        <div class="control-group">
            <label>Forward Accel: <span id="val-accel">0.02</span></label>
            <input type="range" id="accel" min="0.005" max="0.1" step="0.005" value="0.02">
        </div>
        <div class="control-group">
            <label>Braking Decel: <span id="val-brake">0.015</span></label>
            <input type="range" id="brake" min="0.005" max="0.05" step="0.005" value="0.015">
        </div>
        <div class="control-group">
            <label>Top Speed: <span id="val-topSpeed">1.5</span></label>
            <input type="range" id="topSpeed" min="0.5" max="3.0" step="0.1" value="1.5">
        </div>
        <div class="control-group">
            <label>Turn Rate (Steer): <span id="val-turnRate">0.03</span></label>
            <input type="range" id="turnRate" min="0.005" max="0.08" step="0.005" value="0.03">
        </div>

        <h2>CAMERA STUDIO</h2>
        <div class="control-group">
            <label>Field of View (FOV): <span id="val-fov">65</span>°</label>
            <input type="range" id="fov" min="30" max="120" step="1" value="65">
        </div>
        <div class="control-group">
            <label>Camera Zoom (Dist): <span id="val-zoom">9</span>m</label>
            <input type="range" id="zoom" min="3" max="30" step="1" value="9">
        </div>
        <div class="control-group">
            <label>Camera Smoothing: <span id="val-smoothing">0.12</span></label>
            <input type="range" id="smoothing" min="0.01" max="0.5" step="0.01" value="0.12">
        </div>

        <h2>MODEL ORIENTATION FIXER</h2>
        <div class="control-group">
            <label>Model Rotation X: <span id="val-rotX">0</span>°</label>
            <input type="range" id="rotX" min="-180" max="180" step="1" value="0">
        </div>
        <div class="control-group">
            <label>Model Rotation Y: <span id="val-rotY">180</span>°</label>
            <input type="range" id="rotY" min="-180" max="180" step="1" value="180">
        </div>
        <div class="control-group">
            <label>Model Rotation Z: <span id="val-rotZ">0</span>°</label>
            <input type="range" id="rotZ" min="-180" max="180" step="1" value="0">
        </div>

        <div class="upload-section">
            <label class="upload-btn" for="modelUpload">Upload Car (.glb / .gltf / .fbx)</label>
            <input type="file" id="modelUpload" accept=".glb,.gltf,.fbx">
        </div>
    </div>

    <div id="hud">
        <div id="hud-speed">SPEED: 0 MPH</div>
        <div id="hud-controls">[W/S] Drive | [A/D] Steer & Turn</div>
    </div>

    <!-- Three.js & Loaders CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.7.4/umd/index.min.js"></script>

    <script>
        // Physics & Tuning Configuration State
        const physics = {
            weight: 1000,
            accel: 0.02,
            brake: 0.015,
            topSpeed: 1.5,
            turnRate: 0.03,
            fov: 65,
            zoom: 9,
            smoothing: 0.12,
            rotX: 0,
            rotY: 180,
            rotZ: 0
        };

        // UI Binding Setup
        const bindings = [
            { id: 'weight', key: 'weight', unit: ' kg' },
            { id: 'accel', key: 'accel', unit: '' },
            { id: 'brake', key: 'brake', unit: '' },
            { id: 'topSpeed', key: 'topSpeed', unit: '' },
            { id: 'turnRate', key: 'turnRate', unit: '' },
            { id: 'fov', key: 'fov', unit: '°' },
            { id: 'zoom', key: 'zoom', unit: 'm' },
            { id: 'smoothing', key: 'smoothing', unit: '' },
            { id: 'rotX', key: 'rotX', unit: '°' },
            { id: 'rotY', key: 'rotY', unit: '°' },
            { id: 'rotZ', key: 'rotZ', unit: '°' }
        ];

        bindings.forEach(b => {
            const input = document.getElementById(b.id);
            const span = document.getElementById(`val-${b.id}`);
            input.addEventListener('input', (e) => {
                physics[b.key] = parseFloat(e.target.value);
                span.textContent = physics[b.key] + b.unit;
                if(b.key === 'fov') {
                    camera.fov = physics.fov;
                    camera.updateProjectionMatrix();
                }
                if(b.key.startsWith('rot')) {
                    updateCarRotation();
                }
            });
        });

        function updateCarRotation() {
            carModelGroup.rotation.x = THREE.MathUtils.degToRad(physics.rotX);
            carModelGroup.rotation.y = THREE.MathUtils.degToRad(physics.rotY);
            carModelGroup.rotation.z = THREE.MathUtils.degToRad(physics.rotZ);
        }

        // Clean White & Grid Scene Setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);
        scene.fog = new THREE.FogExp2(0xffffff, 0.008);

        const camera = new THREE.PerspectiveCamera(physics.fov, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Bright Studio Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(30, 80, 50);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 250;
        const d = 100;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        scene.add(dirLight);

        // Infinite White Ground Plane with Grid
        const planeGeo = new THREE.PlaneGeometry(2000, 2000);
        const planeMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 1.0 });
        const plane = new THREE.Mesh(planeGeo, planeMat);
        plane.rotation.x = -Math.PI / 2;
        plane.receiveShadow = true;
        scene.add(plane);

        const gridHelper = new THREE.GridHelper(2000, 200, 0x94a3b8, 0xe2e8f0);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        // Vehicle Container & Default Placeholder Car
        const carContainer = new THREE.Group();
        carContainer.position.set(0, 0, 0);
        scene.add(carContainer);

        const carModelGroup = new THREE.Group();
        carContainer.add(carModelGroup);

        const bodyGeo = new THREE.BoxGeometry(2, 0.8, 4.2);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2563eb, metalness: 0.3, roughness: 0.2 });
        const carBody = new THREE.Mesh(bodyGeo, bodyMat);
        carBody.position.y = 0.4;
        carBody.castShadow = true;
        carModelGroup.add(carBody);

        const roofGeo = new THREE.BoxGeometry(1.6, 0.6, 2.2);
        const roofMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.5, roughness: 0.1 });
        const carRoof = new THREE.Mesh(roofGeo, roofMat);
        carRoof.position.set(0, 1.1, -0.2);
        carRoof.castShadow = true;
        carModelGroup.add(carRoof);

        updateCarRotation();

        // Model Uploader (.glb, .gltf, .fbx)
        const fileInput = document.getElementById('modelUpload');
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            const fileName = file.name.toLowerCase();

            reader.readAsArrayBuffer(file);
            reader.onload = function (event) {
                const contents = event.target.result;

                if (fileName.endsWith('.glb') || fileName.endsWith('.gltf')) {
                    const loader = new THREE.GLTFLoader();
                    loader.parse(contents, '', (gltf) => {
                        carModelGroup.clear();
                        const loadedMesh = gltf.scene;
                        loadedMesh.traverse(child => {
                            if (child.isMesh) {
                                child.castShadow = true;
                                child.receiveShadow = true;
                            }
                        });
                        carModelGroup.add(loadedMesh);
                        updateCarRotation();
                    }, (err) => { console.error(err); alert('Failed to parse GLB/GLTF model.'); });
                } 
                else if (fileName.endsWith('.fbx')) {
                    try {
                        const loader = new THREE.FBXLoader();
                        const decodedData = loader.parse(contents, '');
                        carModelGroup.clear();
                        decodedData.traverse(child => {
                            if (child.isMesh) {
                                child.castShadow = true;
                                child.receiveShadow = true;
                            }
                        });
                        carModelGroup.add(decodedData);
                        updateCarRotation();
                    } catch (err) {
                        console.error(err);
                        alert('Failed to parse FBX model. Ensure it is a valid binary FBX.');
                    }
                }
            };
        });

        // Controls State
        const keys = { w: false, s: false, a: false, d: false };
        window.addEventListener('keydown', (e) => {
            if (['w','W'].includes(e.key)) keys.w = true;
            if (['s','S'].includes(e.key)) keys.s = true;
            if (['a','A'].includes(e.key)) keys.a = true;
            if (['d','D'].includes(e.key)) keys.d = true;
        });
        window.addEventListener('keyup', (e) => {
            if (['w','W'].includes(e.key)) keys.w = false;
            if (['s','S'].includes(e.key)) keys.s = false;
            if (['a','A'].includes(e.key)) keys.a = false;
            if (['d','D'].includes(e.key)) keys.d = false;
        });

        let currentSpeed = 0;
        let carAngle = 0;

        // Animation / Real Turn Physics Loop
        function animate() {
            requestAnimationFrame(animate);

            const effectiveAccel = physics.accel * (1000 / physics.weight);
            const effectiveBrake = physics.brake * (1000 / physics.weight);

            if (keys.w) currentSpeed = Math.min(currentSpeed + effectiveAccel, physics.topSpeed);
            else if (keys.s) currentSpeed = Math.max(currentSpeed - effectiveBrake, -physics.topSpeed / 2);
            else {
                if (currentSpeed > 0) currentSpeed = Math.max(0, currentSpeed - effectiveBrake);
                if (currentSpeed < 0) currentSpeed = Math.min(0, currentSpeed + effectiveBrake);
            }

            // Real steering rotation based on speed and turn rate
            if (Math.abs(currentSpeed) > 0.02) {
                const turnMultiplier = currentSpeed > 0 ? 1 : -1;
                if (keys.a) carAngle += physics.turnRate * turnMultiplier;
                if (keys.d) carAngle -= physics.turnRate * turnMultiplier;
            }

            carContainer.rotation.y = carAngle;

            // Move car forward in the direction it is facing
            carContainer.position.x += Math.sin(carAngle) * currentSpeed;
            carContainer.position.z += Math.cos(carAngle) * currentSpeed;

            // Smooth 3D Camera Follow orbiting behind the car
            const targetCamX = carContainer.position.x - Math.sin(carAngle) * physics.zoom;
            const targetCamY = carContainer.position.y + (physics.zoom * 0.4);
            const targetCamZ = carContainer.position.z - Math.cos(carAngle) * physics.zoom;

            camera.position.x += (targetCamX - camera.position.x) * physics.smoothing;
            camera.position.y += (targetCamY - camera.position.y) * physics.smoothing;
            camera.position.z += (targetCamZ - camera.position.z) * physics.smoothing;

            camera.lookAt(carContainer.position.x, carContainer.position.y + 1, carContainer.position.z);

            // Update HUD Speed Display
            document.getElementById('hud-speed').textContent = `SPEED: ${Math.round(Math.abs(currentSpeed) * 85)} MPH`;

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
